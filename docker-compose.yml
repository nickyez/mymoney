services:
  backend:
    build: .
    image: nickyez/mymoney:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8017:8017"
    volumes:
      # Persist the database; config.json is created by the app in /app on first save.
      - mymoney-data:/app/data
    environment:
      - EXPENSE_DB=/app/data/transactions.db
      - MYMONEY_CONFIG=/app/data/config.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8017/api/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  daemon:
    profiles: ["gmail"]
    build: .
    image: nickyez/mymoney:latest
    restart: unless-stopped
    command: python tracker_daemon.py
    volumes:
      - mymoney-data:/app/data
      - ./service_account.json:/app/web/backend/service_account.json:ro
    environment:
      - EXPENSE_DB=/app/data/transactions.db
      - MYMONEY_CONFIG=/app/data/config.json
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mymoney-data:
    driver: local
